:root{
  --bg:#faf8f3; --bg-raised:#ffffff; --fg:#1a1a1a; --fg-2:#4a4a48; --fg-3:#7a7a76;
  --border:#e3dfd2; --border-strong:#c9c4b4; --brand:#2f6b4f; --brand-soft:#e4ede7;
  --font-serif:'Newsreader','Source Serif Pro',Charter,Georgia,serif;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --font-mono:'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151513; --bg-raised:#1e1e1b; --fg:#f2f0ea; --fg-2:#c9c6bc; --fg-3:#8f8c83;
    --border:#2e2d29; --border-strong:#45433d; --brand:#6fae8c; --brand-soft:#1d2a22; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font-sans);font-size:17px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:56px 16px 80px}
header{border-bottom:1.5px solid var(--border-strong);padding-bottom:24px;margin-bottom:8px}
h1{font-family:var(--font-serif);font-weight:500;font-size:clamp(34px,7vw,48px);line-height:1.08;letter-spacing:-0.02em;color:var(--fg);margin:0}
.sub{font-family:var(--font-serif);font-size:clamp(18px,3vw,21px);line-height:1.4;margin:14px 0 0;max-width:46ch}
.ticks{height:8px;margin-top:20px;background-image:repeating-linear-gradient(90deg,var(--border-strong) 0 1px,transparent 1px 13px)}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--brand);margin:44px 0 4px}
h2{font-family:var(--font-serif);font-weight:500;font-size:clamp(24px,4.5vw,30px);line-height:1.2;color:var(--fg);margin:0 0 16px}
.game{display:block;text-decoration:none;background:var(--bg-raised);border:1px solid var(--border);border-left:3px solid var(--brand);
  border-radius:0 10px 10px 0;padding:16px 20px;margin:0 0 12px;transition:background .15s}
.game:hover,.game:focus-visible{background:var(--brand-soft)}
.game .t{display:block;font-weight:600;color:var(--fg);font-size:18px}
.game .d{display:block;margin-top:4px;font-size:15px;color:var(--fg-2)}
footer{margin-top:64px;padding-top:20px;border-top:1.5px solid var(--border-strong);font-family:var(--font-mono);font-size:12px;letter-spacing:0.06em;color:var(--fg-3)}
</style>
</head>

<div class="wrap">
  <header>
    <h1>Gry na zajęcia</h1>
    <p class="sub">Krótkie gry przeglądarkowe do ćwiczeń na zajęciach. Działają także na telefonie.</p>
    <div class="ticks"></div>
  </header>
  <main>
    <section>
      <div class="eyebrow">Semestr zimowy</div>
      <h2>Społeczeństwo sieci</h2>
      <a class="game" href="spoleczenstwo-sieci/wiki-wyscig.html">
        <span class="t">Wiki-wyścig — small world w praktyce</span>
        <span class="d">Dojdź od jednego artykułu Wikipedii do drugiego, klikając wyłącznie w linki.</span>
      </a>
    </section>
  </main>
  <footer>Kolejne gry pojawiają się w miarę postępu zajęć.</footer>
</div>
</body>
